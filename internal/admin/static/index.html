<!-- 登录 -->
<div class="login" id="loginWrap">
  <div class="login-card">
    <div class="login-brand"><span class="brand-mark"><svg><use href="#i-logo"/></svg></span><b>EmbyProxy</b></div>
    <h1>登录控制台</h1>
    <form class="login-form" id="loginForm" autocomplete="on" novalidate>
      <div class="login-hint" id="loginHint" hidden></div>
      <div class="field">
        <label class="field-label" for="tokenInput">管理员 Token</label>
        <input class="input mono" id="tokenInput" type="password" autocomplete="current-password" spellcheck="false" placeholder="ADMIN_TOKEN">
      </div>
      <div class="field" id="totpLoginWrap" hidden>
        <label class="field-label" for="totpInput">动态验证码</label>
        <input class="input code-input" id="totpInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
        <div class="field-help">打开验证器，输入 6 位动态验证码。</div>
      </div>
      <div class="login-err" id="loginErr" role="alert" style="display:none"></div>
      <button class="btn btn-primary btn-lg" id="loginButton" type="submit">登录</button>
    </form>
  </div>
</div>

<!-- 控制台 -->
<div class="app" id="app" data-bp="wide" style="display:none">
  <div class="shell">
    <header>
      <div class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <span class="brand-mark"><svg><use href="#i-logo"/></svg></span>
            <span class="brand-name">EmbyProxy</span>
            <span class="brand-ver" id="appVersion"></span>
          </div>
          <nav class="nav" id="mainNav" aria-label="主导航">
            <button class="nav-item" data-tab="nodes" title="节点"><svg><use href="#i-nodes"/></svg><span class="nav-label">节点</span><span class="count" id="navCount"></span></button>
            <button class="nav-item" data-tab="stats" title="统计"><svg><use href="#i-stats"/></svg><span class="nav-label">统计</span></button>
            <button class="nav-item" data-tab="logs" title="日志"><svg><use href="#i-logs"/></svg><span class="nav-label">日志</span></button>
            <span class="nav-sep" aria-hidden="true"></span>
            <button class="nav-item sys" data-act="open-config" title="系统配置"><svg><use href="#i-settings"/></svg><span class="nav-label">配置</span></button>
            <button class="nav-item sys" data-act="open-notify" title="通知"><svg><use href="#i-bell"/></svg><span class="nav-label">通知</span><span class="badge" id="notifyBadge" hidden></span></button>
            <button class="nav-item sys logout" data-act="logout" title="退出登录" aria-label="退出登录"><svg><use href="#i-logout"/></svg></button>
          </nav>
        </div>
      </div>
      <div class="banner" id="emergencyBanner" hidden><svg><use href="#i-warn"/></svg><span>双重验证已通过 ADMIN_2FA_DISABLED 临时停用，当前只验证管理员 Token。恢复后请移除该变量并重启。</span></div>
    </header>
    <main class="main" id="main">
      <section class="page" id="pageNodes" data-page="nodes"></section>
      <section class="page" id="pageStats" data-page="stats" hidden></section>
      <section class="page" id="pageLogs" data-page="logs" hidden></section>
    </main>
  </div>
  <div id="overlay"></div>
  <div id="overlay2"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<script src="/admin/assets/core.js"></script>
<script src="/admin/assets/nodes.js"></script>
<script src="/admin/assets/settings.js"></script>
<script src="/admin/assets/stats.js"></script>
<script src="/admin/assets/logs.js"></script>
</body>
</html>
